# Local test server for the court manager.
#
#   docker compose up --build     start (rebuilds the image)
#   docker compose down           stop
#
# Then open http://localhost:8080

services:
  badminton:
    build:
      context: .
    image: badminton-court-manager:local
    container_name: badminton
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
